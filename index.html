<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مغسلة مزايا الأولى</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef5f5; --surface:#ffffff; --line:#d9e5e5;
  --text:#0d2b33; --muted:#5b7278;
  --brand:#0f8b8d; --brand-deep:#0b5e60;
  --gold:#f2b705; --gold-deep:#c98f02;
  --danger:#c8412f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0c2226; --surface:#123338; --line:#204349;
    --text:#eaf4f4; --muted:#8ea9ac;
    --brand:#22b3ac; --brand-deep:#1a8e88;
  }
}
:root[data-theme="dark"]{
  --paper:#0c2226; --surface:#123338; --line:#204349;
  --text:#eaf4f4; --muted:#8ea9ac; --brand:#22b3ac; --brand-deep:#1a8e88;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--text);
  font-family:'Cairo','Tahoma',sans-serif;
  display:flex; justify-content:center;
}
#app{width:100%; max-width:560px; min-height:100%; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:5;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;
  background:var(--brand); color:#fff;
  display:flex; align-items:center; justify-content:space-between;
}
.topbar h2{margin:0; font-size:1.05rem; font-weight:800;}
.topbar .badge{font-size:.78rem; opacity:.9;}
.topbar button{
  background:rgba(255,255,255,.18); color:#fff; border:none; border-radius:9px;
  padding:8px 12px; font-size:.82rem; cursor:pointer; font-family:inherit;
}
.wrap{padding:18px 16px 40px; flex:1;}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:16px;
  padding:20px; margin-bottom:16px;
}
.field-label{display:block; font-size:.85rem; color:var(--muted); margin:2px 0 8px; font-weight:600;}
input[type=text],input[type=password],input[type=tel]{
  width:100%; padding:14px; font-size:1.1rem; border-radius:12px;
  border:1px solid var(--line); background:var(--paper); color:var(--text);
  margin-bottom:16px; text-align:center; font-family:inherit;
}
.big-btn{
  display:block; width:100%; padding:16px; border:none; border-radius:13px;
  background:var(--brand); color:#fff; font-size:1.02rem; font-weight:700;
  cursor:pointer; font-family:inherit;
}
.big-btn:active{background:var(--brand-deep)}
.seg{display:flex; gap:8px; margin-bottom:16px;}
.seg-btn{
  flex:1; padding:12px 6px; border-radius:11px; border:1px solid var(--line);
  background:var(--paper); color:var(--text); font-size:.92rem; cursor:pointer;
  font-family:inherit; font-weight:600;
}
.seg-btn.active{background:var(--brand); border-color:var(--brand); color:#fff;}
.center{text-align:center}
.muted{color:var(--muted); font-size:.85rem;}
.err{color:var(--danger); font-size:.9rem; margin-top:8px;}
.plate-display{font-size:1.35rem; font-weight:800; text-align:center; margin-bottom:6px;}
.dots{display:flex; gap:8px; justify-content:center; margin:14px 0;}
.dot{width:26px; height:26px; border-radius:50%; background:var(--line); display:flex; align-items:center; justify-content:center; font-size:.78rem; color:var(--muted);}
.dot.filled{background:var(--brand); color:#fff;}
.free{
  background:linear-gradient(135deg,var(--gold),var(--gold-deep)); color:#231a00;
  padding:14px; border-radius:12px; text-align:center; font-weight:800; margin-top:12px;
}
.stats-grid{display:flex; gap:10px; margin-bottom:6px;}
.stat-box{flex:1; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:12px 6px; text-align:center;}
.stat-num{font-size:1.35rem; font-weight:800; color:var(--brand);}
.stat-label{font-size:.76rem; color:var(--muted); margin-top:2px;}
.section-title{font-size:.95rem; font-weight:800; margin:4px 0 12px;}
.bar-row{display:flex; align-items:center; gap:8px; margin-bottom:9px;}
.bar-label{width:64px; font-size:.82rem; color:var(--muted); flex-shrink:0;}
.bar-track{flex:1; height:14px; background:var(--paper); border-radius:7px; overflow:hidden;}
.bar-fill{height:100%; background:var(--brand); border-radius:7px;}
.bar-fill.max{background:var(--gold-deep);}
.bar-value{width:26px; text-align:left; font-size:.8rem; font-weight:700;}
.login-wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:20px;}
.hint{font-size:.78rem; color:var(--muted); text-align:center; margin-top:4px;}
.btn-secondary{flex:1; padding:16px; border:1px solid var(--line); background:var(--paper); color:var(--text); border-radius:13px; font-weight:700; cursor:pointer; font-family:inherit; font-size:1rem;}
.confirm-row{display:flex; gap:8px; margin-top:12px;}
input[type=month]{width:100%; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--paper); color:var(--text); font-family:inherit; font-size:1rem; margin-bottom:4px;}
.table-wrap{overflow-x:auto; margin-top:10px;}
.report-table{width:100%; border-collapse:collapse; min-width:520px;}
.report-table th,.report-table td{padding:8px 6px; border-bottom:1px solid var(--line); font-size:.82rem; text-align:center; white-space:nowrap;}
.report-table th{color:var(--muted); font-weight:700;}
.report-table tr.total-row{font-weight:800; background:var(--paper);}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

// ====== ضع إعدادات مشروعك من Firebase Project settings هنا ======
const firebaseConfig = {
  apiKey: "AIzaSyBJn9oVNiiXlQh2uF3vLHAaKqJj5ZT7P6A",
  authDomain: "mazaiacarwash.firebaseapp.com",
  projectId: "mazaiacarwash",
  storageBucket: "mazaiacarwash.firebasestorage.app",
  messagingSenderId: "402089110437",
  appId: "1:402089110437:web:062b3aafd6aad5fde0d64c"
};
// ================================================================

const BRANCH_COUNT = 12;
const AR_WEEKDAYS = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

const fbApp = initializeApp(firebaseConfig);
const firestore = getFirestore(fbApp);
const auth = getAuth(fbApp);
// يجيب بيانات الموظف (مالك/فرع) من مستند staff/{uid} — هذا المستند يُنشأ يدويًا من الكونسول فقط، ما يقدر المستخدم يعدله بنفسه
async function getStaffInfo(uid){
  try{
    const snap = await getDoc(doc(firestore,"staff",uid));
    return snap.exists() ? snap.data() : null;
  }catch(e){ return null; }
}

function pad(n){ return n<10 ? "0"+n : ""+n; }
function fmtDate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function monthKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function startOfWeek(d){ const c=new Date(d.getFullYear(),d.getMonth(),d.getDate()); c.setDate(c.getDate()-c.getDay()); return c; }
function fmtHour(h){ const period = h<12 ? "ص" : "م"; let hh = h%12; if(hh===0) hh=12; return hh+":00 "+period; }
const AR_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function arMonthLabel(mk){ const [y,m] = mk.split("-").map(Number); return AR_MONTHS[m-1]+" "+y; }
function normalizePlate(raw){ return (raw||"").trim().toUpperCase().replace(/\s+/g,""); }

function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }

// ---- الدخول عبر Firebase الحقيقي ----
function topbar(title, badge){
  return `<div class="topbar"><div><h2>${title}</h2>${badge?`<div class="badge">${badge}</div>`:""}</div><button id="logoutBtn">خروج</button></div>`;
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(el(`<div class="login-wrap"><p class="muted center">جاري التحقق من الدخول...</p></div>`));
  onAuthStateChanged(auth, async (user) => {
    app.innerHTML = "";
    if(!user){ app.appendChild(renderLogin()); return; }
    const staff = await getStaffInfo(user.uid);
    if(!staff){
      app.appendChild(el(`<div class="login-wrap"><div class="card center">
        <p class="err">حسابك مسجل دخول لكن ما له صلاحية بعد داخل النظام. تواصل مع المسؤول لإضافتك.</p>
        <button class="big-btn" id="signOutBtn">خروج</button>
      </div></div>`));
      document.getElementById("signOutBtn").onclick = () => signOut(auth);
      return;
    }
    if(staff.role === "owner") app.appendChild(renderOwner());
    else app.appendChild(renderWorker(staff.branch));
  });
}

function bindLogout(wrap){
  const btn = wrap.querySelector("#logoutBtn");
  if(btn) btn.onclick = () => signOut(auth);
}

function renderLogin(){
  const wrap = el(`<div class="login-wrap">
    <div class="card" style="width:100%">
      <h2 class="center" style="margin-top:0">🚗 مغسلة مزايا الأولى</h2>
      <label class="field-label">البريد الإلكتروني</label>
      <input type="text" id="email" placeholder="مثال: branch1@mazaya.local" autocomplete="username">
      <label class="field-label">كلمة المرور</label>
      <input type="password" id="pw" placeholder="كلمة المرور" autocomplete="current-password">
      <button class="big-btn" id="loginBtn">دخول</button>
      <div id="loginErr"></div>
    </div>
  </div>`);
  const doLogin = async () => {
    const email = wrap.querySelector("#email").value.trim();
    const pw = wrap.querySelector("#pw").value;
    const errBox = wrap.querySelector("#loginErr");
    const btn = wrap.querySelector("#loginBtn");
    if(!email || !pw){ errBox.innerHTML = `<p class="err center">أدخل البريد وكلمة المرور</p>`; return; }
    btn.disabled = true; btn.textContent = "جاري الدخول...";
    try{
      await signInWithEmailAndPassword(auth, email, pw);
      // onAuthStateChanged بيتكفل بإعادة العرض تلقائيًا
    }catch(e){
      errBox.innerHTML = `<p class="err center">بيانات الدخول غير صحيحة</p>`;
      btn.disabled = false; btn.textContent = "دخول";
    }
  };
  wrap.querySelector("#loginBtn").onclick = doLogin;
  wrap.querySelector("#pw").addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });
  return wrap;
}

function cardStatusHtml(total, sinceReward, isFree, extraLine){
  let dotsHtml = "";
  const filled = isFree ? 5 : sinceReward;
  for(let i=1;i<=5;i++) dotsHtml += `<div class="dot ${i<=filled?"filled":""}">${i}</div>`;
  return `
    ${extraLine ? `<p class="center muted">${extraLine}</p>` : ""}
    <p class="center muted">إجمالي الزيارات: ${total}</p>
    <div class="dots">${dotsHtml}</div>
    ${isFree ? `<div class="free">🎉 مبروك! هذه الغسلة مجانية</div>` : `<p class="center muted">متبقي ${5 - sinceReward} غسلة/غسلات للحصول على غسلة مجانية</p>`}
  `;
}

function renderWorker(branch){
  const wrap = el(`<div>
    ${topbar("تسجيل غسلة", "فرع رقم "+branch)}
    <div class="wrap">
      <div class="card">
        <label class="field-label">رقم اللوحة</label>
        <input type="text" id="plate" placeholder="أدخل رقم اللوحة" autocomplete="off" style="text-transform:uppercase">

        <label class="field-label">حجم السيارة</label>
        <div class="seg" id="sizeSeg">
          <button class="seg-btn active" data-v="سيدان">سيدان</button>
          <button class="seg-btn" data-v="وسط">وسط</button>
          <button class="seg-btn" data-v="كبيرة">كبيرة</button>
        </div>

        <label class="field-label">نوع الغسلة</label>
        <div class="seg" id="typeSeg">
          <button class="seg-btn active" data-v="داخلي">داخلي</button>
          <button class="seg-btn" data-v="داخلي وخارجي">داخلي وخارجي</button>
        </div>

        <button class="big-btn" id="submit">تسجيل الغسلة</button>
        <div id="confirmArea"></div>
        <div id="result"></div>
      </div>

      <div class="card">
        <p class="section-title">استعلام عن سيارة (بدون تسجيل غسلة جديدة)</p>
        <input type="text" id="lookupPlate" placeholder="أدخل رقم اللوحة" autocomplete="off" style="text-transform:uppercase">
        <button class="big-btn" id="lookupBtn">استعلام</button>
        <div id="lookupResult"></div>
      </div>
    </div>
  </div>`);
  bindLogout(wrap);

  function bindSeg(segId){
    const seg = wrap.querySelector(segId);
    seg.querySelectorAll(".seg-btn").forEach(b => {
      b.onclick = () => { seg.querySelectorAll(".seg-btn").forEach(x=>x.classList.remove("active")); b.classList.add("active"); };
    });
    return () => seg.querySelector(".seg-btn.active").dataset.v;
  }
  const getSize = bindSeg("#sizeSeg");
  const getType = bindSeg("#typeSeg");

  const btn = wrap.querySelector("#submit");
  const confirmArea = wrap.querySelector("#confirmArea");
  const resultBox = wrap.querySelector("#result");
  const plateInput = wrap.querySelector("#plate");

  btn.onclick = () => {
    const plate = normalizePlate(plateInput.value);
    if(!plate){ resultBox.innerHTML = `<p class="err">الرجاء إدخال رقم اللوحة</p>`; return; }
    resultBox.innerHTML = "";
    const size = getSize(), type = getType();
    confirmArea.innerHTML = `
      <div class="card" style="background:var(--paper); margin-top:12px;">
        <p class="center muted" style="margin-top:0">تأكيد البيانات قبل التسجيل</p>
        <div class="plate-display">${plate}</div>
        <p class="center muted">${size} · ${type}</p>
        <div class="confirm-row">
          <button class="big-btn" id="confirmYes" style="flex:1">تأكيد وتسجيل</button>
          <button class="btn-secondary" id="confirmNo">تعديل</button>
        </div>
      </div>
    `;
    wrap.querySelector("#confirmNo").onclick = () => { confirmArea.innerHTML = ""; };
    wrap.querySelector("#confirmYes").onclick = async () => {
      const yesBtn = wrap.querySelector("#confirmYes");
      yesBtn.disabled = true; yesBtn.textContent = "جاري التسجيل...";
      try{
        const now = new Date();
        const visitData = {
          plate, branch, carSize:size, washType:type,
          dateKey: fmtDate(now), month: monthKey(now),
          weekday: now.getDay(), hour: now.getHours(), ts: now.toISOString()
        };
        await addDoc(collection(firestore,"visits"), visitData);

        const cardRef = doc(firestore,"cards",plate);
        const snap = await getDoc(cardRef);
        const prev = snap.exists() ? snap.data() : {};
        let total = (prev.total||0)+1;
        let sinceReward = (prev.sinceReward||0)+1;
        let isFree = false;
        if(sinceReward>=5){ isFree=true; sinceReward=0; }
        await setDoc(cardRef, { plate, total, sinceReward, lastVisit: visitData.ts });

        resultBox.innerHTML = `<div class="plate-display">${plate}</div>` + cardStatusHtml(total, sinceReward, isFree, `${size} · ${type}`);
        plateInput.value = "";
      }catch(e){
        resultBox.innerHTML = `<p class="err">حدث خطأ أثناء التسجيل: ${(e && e.code) || "غير معروف"}</p>`;
      }
      confirmArea.innerHTML = "";
    };
  };

  const lookupBtn = wrap.querySelector("#lookupBtn");
  const lookupResult = wrap.querySelector("#lookupResult");
  lookupBtn.onclick = async () => {
    const plate = normalizePlate(wrap.querySelector("#lookupPlate").value);
    if(!plate){ lookupResult.innerHTML = `<p class="err">الرجاء إدخال رقم اللوحة</p>`; return; }
    lookupBtn.disabled = true; lookupBtn.textContent = "جاري البحث...";
    try{
      const snap = await getDoc(doc(firestore,"cards",plate));
      if(!snap.exists()){
        lookupResult.innerHTML = `<p class="muted center">ما فيه سجل لهذي اللوحة بعد — أول غسلة لها.</p>`;
      }else{
        const d = snap.data();
        lookupResult.innerHTML = `<div class="plate-display">${plate}</div>` + cardStatusHtml(d.total||0, d.sinceReward||0, false);
      }
    }catch(e){
      lookupResult.innerHTML = `<p class="err">تعذر البحث: ${(e && e.code) || "غير معروف"}</p>`;
    }
    lookupBtn.disabled = false; lookupBtn.textContent = "استعلام";
  };
  return wrap;
}

function renderOwner(){
  const defaultMonthValue = monthKey(new Date());
  const wrap = el(`<div>
    ${topbar("لوحة إحصائيات المالك")}
    <div class="wrap">
      <div class="card">
        <p class="section-title">التقرير اليومي (يتصفر كل يوم فجرًا)</p>
        <div id="dailyReport"><p class="muted center">جاري التحميل...</p></div>
      </div>

      <div class="card">
        <label class="field-label">عرض إحصائيات لفرع</label>
        <select id="branchFilter" style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--paper); color:var(--text); font-family:inherit; font-size:1rem; margin-bottom:14px;">
          <option value="all">كل الفروع</option>
          ${Array.from({length:BRANCH_COUNT},(_,i)=>`<option value="${i+1}">فرع ${i+1}</option>`).join("")}
        </select>
        <label class="field-label">الشهر</label>
        <input type="month" id="monthFilter" value="${defaultMonthValue}">
      </div>
      <div id="ownerBody"><p class="muted center">جاري التحميل...</p></div>
    </div>
  </div>`);
  bindLogout(wrap);
  loadOwnerStats(wrap);
  return wrap;
}

function buildDailyReport(todayDocs){
  const perBranch = {};
  const combined = { dakhili:0, both:0, sedan:0, wasat:0, kabira:0, total:0 };
  todayDocs.forEach(v => {
    const b = v.branch;
    if(!perBranch[b]) perBranch[b] = { dakhili:0, both:0, sedan:0, wasat:0, kabira:0, total:0 };
    const row = perBranch[b];
    row.total++; combined.total++;
    if(v.washType==="داخلي"){ row.dakhili++; combined.dakhili++; }
    else if(v.washType==="داخلي وخارجي"){ row.both++; combined.both++; }
    if(v.carSize==="سيدان"){ row.sedan++; combined.sedan++; }
    else if(v.carSize==="وسط"){ row.wasat++; combined.wasat++; }
    else if(v.carSize==="كبيرة"){ row.kabira++; combined.kabira++; }
  });

  let rows = "";
  for(let b=1; b<=BRANCH_COUNT; b++){
    const r = perBranch[b] || { dakhili:0, both:0, sedan:0, wasat:0, kabira:0, total:0 };
    rows += `<tr><td>فرع ${b}</td><td>${r.dakhili}</td><td>${r.both}</td><td>${r.sedan}</td><td>${r.wasat}</td><td>${r.kabira}</td><td>${r.total}</td></tr>`;
  }
  rows += `<tr class="total-row"><td>الإجمالي</td><td>${combined.dakhili}</td><td>${combined.both}</td><td>${combined.sedan}</td><td>${combined.wasat}</td><td>${combined.kabira}</td><td>${combined.total}</td></tr>`;

  return `<div class="table-wrap"><table class="report-table">
    <thead><tr><th>الفرع</th><th>داخلي</th><th>داخلي وخارجي</th><th>سيدان</th><th>وسط</th><th>كبيرة</th><th>الإجمالي</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

async function loadOwnerStats(wrap){
  const body = wrap.querySelector("#ownerBody");
  const dailyBody = wrap.querySelector("#dailyReport");
  try{
    const now = new Date();
    const todayKey = fmtDate(now);
    const defaultMonth = monthKey(now);
    const sow = startOfWeek(now);
    const weekKeys = [];
    for(let i=0;i<7;i++){ const d=new Date(sow); d.setDate(sow.getDate()+i); weekKeys.push(fmtDate(d)); }
    const weekStart = weekKeys[0], weekEnd = weekKeys[6];

    const visitsCol = collection(firestore,"visits");
    const [todaySnap, weekSnap, monthSnap, cardsSnap] = await Promise.all([
      getDocs(query(visitsCol, where("dateKey","==",todayKey))),
      getDocs(query(visitsCol, where("dateKey",">=",weekStart), where("dateKey","<=",weekEnd))),
      getDocs(query(visitsCol, where("month","==",defaultMonth))),
      getDocs(collection(firestore,"cards"))
    ]);

    const todayDocs = todaySnap.docs.map(d=>d.data());
    dailyBody.innerHTML = buildDailyReport(todayDocs);

    // نخزن كل البيانات (كل الفروع) مرة وحدة، ونفلترها محليًا كل ما تغيّر اختيار الفرع أو الشهر — بدون طلب إضافي إلا لو الشهر جديد
    const rawData = {
      today: todayDocs,
      week: weekSnap.docs.map(d=>d.data()),
      totalCarsAll: cardsSnap.size
    };
    const monthCache = { [defaultMonth]: monthSnap.docs.map(d=>d.data()) };
    let currentBranch = "all";
    let currentMonth = defaultMonth;

    const rerender = () => renderOwnerBody(body, rawData, currentBranch, monthCache[currentMonth], currentMonth);
    rerender();

    wrap.querySelector("#branchFilter").onchange = (e) => { currentBranch = e.target.value; rerender(); };
    wrap.querySelector("#monthFilter").onchange = async (e) => {
      const mk = e.target.value;
      if(!mk) return;
      currentMonth = mk;
      if(!monthCache[mk]){
        body.innerHTML = `<p class="muted center">جاري تحميل بيانات ${arMonthLabel(mk)}...</p>`;
        const snap = await getDocs(query(visitsCol, where("month","==",mk)));
        monthCache[mk] = snap.docs.map(d=>d.data());
      }
      rerender();
    };
  }catch(e){
    body.innerHTML = `<p class="err">تعذر تحميل الإحصائيات: ${(e && e.code) || "غير معروف"}</p>`;
    dailyBody.innerHTML = `<p class="err">تعذر تحميل التقرير اليومي</p>`;
  }
}

function renderOwnerBody(body, rawData, branchFilter, monthDocsAll, monthKeyStr){
  const match = branchFilter==="all" ? (()=>true) : (v => String(v.branch)===String(branchFilter));
  const todayCount = rawData.today.filter(match).length;
  const weekTotal = rawData.week.filter(match).length;
  const monthDocs = (monthDocsAll||[]).filter(match);
  const monthTotal = monthDocs.length;

  const weekdayCounts = [0,0,0,0,0,0,0];
  const hourCounts = new Array(24).fill(0);
  const plateSet = new Set();
  monthDocs.forEach(v => {
    if(typeof v.weekday === "number") weekdayCounts[v.weekday]++;
    if(typeof v.hour === "number") hourCounts[v.hour]++;
    if(v.plate) plateSet.add(v.plate);
  });
  const maxWeekday = Math.max(1, ...weekdayCounts);

  let weekdayRows = "";
  weekdayCounts.forEach((c,i) => {
    const pct = Math.round((c/maxWeekday)*100);
    weekdayRows += `<div class="bar-row"><span class="bar-label">${AR_WEEKDAYS[i]}</span><div class="bar-track"><div class="bar-fill ${c===maxWeekday && c>0 ? "max":""}" style="width:${pct}%"></div></div><span class="bar-value">${c}</span></div>`;
  });

  const topHours = hourCounts
    .map((c,h) => ({h,c}))
    .filter(x => x.c>0)
    .sort((a,b) => b.c-a.c)
    .slice(0,5);
  const maxHour = topHours.length ? topHours[0].c : 1;
  let hourRows = topHours.length ? "" : `<p class="muted center">لا توجد بيانات كافية لهذا الشهر</p>`;
  topHours.forEach((x,i) => {
    const pct = Math.round((x.c/maxHour)*100);
    hourRows += `<div class="bar-row"><span class="bar-label">${fmtHour(x.h)}</span><div class="bar-track"><div class="bar-fill ${i===0?"max":""}" style="width:${pct}%"></div></div><span class="bar-value">${x.c}</span></div>`;
  });

  const monthLabel = monthKeyStr ? arMonthLabel(monthKeyStr) : "";
  const carsLine = branchFilter==="all"
    ? `عدد السيارات المسجلة في نظام الولاء (كل الفروع): ${rawData.totalCarsAll}`
    : `عدد السيارات المختلفة اللي زارت هذا الفرع في ${monthLabel}: ${plateSet.size}`;
  const scopeLabel = branchFilter==="all" ? "كل الفروع" : ("فرع "+branchFilter);

  body.innerHTML = `
      <div class="card">
        <div class="stats-grid">
          <div class="stat-box"><div class="stat-num">${todayCount}</div><div class="stat-label">اليوم</div></div>
          <div class="stat-box"><div class="stat-num">${weekTotal}</div><div class="stat-label">هذا الأسبوع</div></div>
          <div class="stat-box"><div class="stat-num">${monthTotal}</div><div class="stat-label">${monthLabel}</div></div>
        </div>
        <p class="muted center" style="margin:8px 0 0">${carsLine}</p>
      </div>
      <div class="card">
        <p class="section-title">الأيام الأكثر ازدحامًا (${monthLabel} — ${scopeLabel})</p>
        ${weekdayRows}
      </div>
      <div class="card">
        <p class="section-title">أكثر 5 ساعات ازدحامًا (${monthLabel} — ${scopeLabel})</p>
        ${hourRows}
      </div>
    `;
}

render();
</script>
</body>
</html>
